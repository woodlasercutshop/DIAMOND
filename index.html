.cx{border:0;background:none;color:var(--mu);font-size:24px;width:34px;height:34px}
.btn.wa{width:100%;margin-top:12px;padding:14px;font-size:17px}
.mph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mpi{aspect-ratio:1;border-radius:14px;background:var(--bg) center/cover no-repeat;position:relative;border:1px solid var(--bd)}
.mpi button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:17px;line-height:1}
.lgo{width:34px;height:34px;border-radius:50%;vertical-align:middle;margin-right:8px;box-shadow:0 0 0 1px rgba(227,190,124,.7)}
.gh{font:700 13px/1 -apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--p);margin:20px 2px 10px}
.mst #seg,.mst #st{display:none}
.mpq{font:italic 17px/1.55 Georgia,serif;margin-bottom:16px;background:linear-gradient(135deg,var(--cd),rgba(201,161,90,.08))}
.mpf{margin:0 0 16px;background:var(--cd);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(201,161,90,.15)}
.mpf img{width:100%;display:block;max-height:440px;object-fit:cover}
.mpf figcaption{padding:12px 16px 14px;font:italic 16px/1.45 Georgia,serif}.mpf figcaption:empty{display:none}
.mpa{display:flex;gap:10px;align-items:flex-start}.mpa img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}.mpa .f{margin:0}
.sph{display:flex;gap:6px;overflow-x:auto;padding:0 4px 4px;margin:-2px 0 12px}.sph img{width:92px;height:92px;object-fit:cover;border-radius:14px;flex:none}

header h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.mst header h1{font-size:15px}
.lgb{display:flex;align-items:center;gap:5px;border:0;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:700;padding:8px 10px}body.m .lgb{display:none}
#lgp{display:none;position:fixed;z-index:35;right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}#lgp .lgs{margin:0;flex-direction:column}
.lgs button{display:inline-block!important;width:auto!important;border:1px solid var(--bd)!important;background:var(--cd)!important;color:var(--tx)!important;border-radius:16px!important;padding:7px 14px!important;font-size:14px!important}
.lgs button.on{background:var(--gr)!important;color:#fff!important;border-color:transparent!important}

body{background:var(--bg) var(--bgo);background-attachment:fixed}
header{position:relative;background:linear-gradient(135deg,#050505 0%,#0e1d24 60%,#0a5568 100%)}
header:after,nav:before{content:'';position:absolute;left:0;right:0;height:6px;background:var(--orb) repeat-x left center/auto 6px}header:after{bottom:0}nav{position:relative}nav:before{top:-6px}
header h1{letter-spacing:.16em;font-family:Georgia,serif}
.btn:not(.s){background:var(--bo) right 12px center/20px no-repeat,var(--gd);padding-right:38px;color:#140d00}
.hero{background:var(--hero) right -16px top -16px/150px no-repeat,var(--gr)}
.tag{background:var(--sk);color:#00222b}
.new{border-color:var(--sk);box-shadow:0 0 0 2px rgba(0,175,202,.22)}
.lgo{box-shadow:0 0 0 1px rgba(240,207,122,.85)}
#dr{background:var(--cd) var(--bgo)}

function faq(v){v=v.toLowerCase();const c=CF(),s=SC(),K={m:'стриж|haircut|\\bcut\\b|fade|фейд|шаш қи|машинк|clipper|детск|kids',b:'бород|усы|усов|мұрт|сақал|beard|mustache|moustache|бритьё|бритв|shave',r:'бров|brow|қас',e:'уши|ухо|ушах|нос|\\bear|nose|құлақ|мұрын',x:'массаж|мытьё|мытье|седин|камуфляж|massage|wash|grey|gray'};
 const gk=Object.keys(K).find(k=>new RegExp(K[k]).test(v));if(gk){const l=S.filter(x=>x.id[0]==gk);if(l.length==1){pick(l[0].id);return 1}if(l.length){CH=l.map(x=>[x.e+' '+x.n,()=>pick(x.id)]);return 'Выберите услугу:'}}

 if(/оплат|kaspi|каспи|налич|перевод|\bpay|cash|төлем/.test(v))return 'Оплата наличными или переводом на KaspiGold: '+fp(c.kp||c.wa);
 if(/бонус|скидк|акци|bonus|discount|жеңілдік/.test(v))return `🎁 От ${c.after} визитов скидка ${c.pct}% на услуги и товары.`;
 if(/адрес|где|address|where|мекенжай|қайда/.test(v))return c.addr?'📍 '+c.addr:'Адрес уточните у мастера в разделе «Связаться».';
 if(/врем|график|работа|открыт|hours|schedule|open|кесте|уақыт|жұмыс/.test(v))return s.W.map((w,i)=>`${DN[i]}: ${w.on?w.f+'–'+w.t:'выходной'}`).join('\n');
 if(/отмен|перенес|cancel|resched|бас тарт/.test(v))return 'Для отмены или переноса напишите мастеру: меню → Связаться с мастером.';
 if(/товар|шампун|воск|масл|бальзам|расчёск|купить|shop|product|buy|дүкен|тауар/.test(v))return 'Товары салона со скидками — во вкладке «Магазин».';
 return 'Я могу записать вас на услугу, назвать цены, график и бонусы. Выберите кнопку или напишите вопрос.'}

function rvimg(id){const u=curU(),r=getI('R',id);if(!u||!r||r.uid!=u.id)return;if(!confirm('Удалить фото?'))return;r.img='';put('R',r);toast('Фото удалено');R()}
function rvclr(){const t=$('#rt')?$('#rt').value:'';RV.img='';rRev();if($('#rt'))$('#rt').value=t}
const myPh=()=>{const u=curU();if(!u)return'';const m=col('R').filter(r=>r.uid==u.id&&r.img).slice().reverse();return `<h3>Мои фото причёсок</h3>`+(m.length?`<div class="mph">${m.map(r=>`<div class="mpi" style="background-image:url(${r.img})" onclick="lbo([getI('R','${r.id}').img],0)"><button onclick="event.stopPropagation();rvimg('${r.id}')">×</button></div>`).join('')}</div>`:'<p class="mu">Фото пока нет. Добавьте фото в отзыве.</p>')};
function rp(id,v){const r=getI('R',id);r.pub=v;r.nw=0;put('R',r);nav();rInb()}
let sub='';
const ssub=k=>{sub=k;rSet()};
function rSet(){const c=CF(),f=$('#fs'),keep=f._s===sub&&$('#fsc')?$('#fsc').scrollTop:0;let o,ttl='Настройки';
 if(sub=='gen'){ttl='Генератор 2FA';o=`<p class="mu" style="margin-top:0">Код клиента действует 3 минуты и меняется сам. Отправьте его клиенту в WhatsApp.</p><div class="card"><div id="gen"></div></div>`}
 else if(sub=='mp'){ttl='Моя страница';o=mpAdmin()}
 else if(sub=='svc'){ttl='Услуги и цены';o=svcAdmin()}
 else if(sub=='prod'){ttl='Товары';o=`${prodAdmin()}<div class="card"><b>Добавить товар</b><input class="f" id="an" placeholder="Название"><input class="f" id="ap" type="number" placeholder="Цена, ₸"><button class="btn" onclick="ap()">Добавить</button></div>`}
 else if(sub=='gal'){ttl='Галерея работ';const ws=col('GL').slice().sort((a,b)=>b.u-a.u);o=`<p class="mu" style="margin-top:0">Одна работа — до 6 фото с разных ракурсов. Ваши работы идут первыми на главном экране.</p><label class="btn" style="display:inline-flex;align-items:center;gap:8px;margin-bottom:10px">${ico('camera',20)} Добавить работу<input type="file" accept="image/*" multiple hidden onchange="gnew(this)"></label>${ws.map((x,k)=>{const im=gim(x);return `<div class="card"><div class="row"><b>Работа ${ws.length-k}</b><button class="btn s" onclick="if(confirm('Удалить работу?'))gdel('${x.id}')">Удалить</button></div><div class="pth">${im.map((u,i)=>`<div style="background:var(--bg) url(${u}) center/contain no-repeat" onclick="lbo(gim(getI('GL','${x.id}')),${i})"><button onclick="event.stopPropagation();gpdel('${x.id}',${i})">×</button></div>`).join('')}${im.length<6?`<label class="add">${ico('camera',22)}<small>${im.length}/6</small><input type="file" accept="image/*" multiple hidden onchange="gmore('${x.id}',this)"></label>`:''}</div></div>`}).join('')}${ws.length?'':'<p class="mu">Своих работ пока нет. Добавьте первую работу.</p>'}${(()=>{const rs=col('R').filter(r=>r.img);return rs.length?`<h3>Фото из отзывов</h3><div class="mph">${rs.map(r=>`<div class="mpi" style="background-image:url(${r.img})" onclick="lbo([getI('R','${r.id}').img],0)"><button onclick="event.stopPropagation();rpd('${r.id}')">×</button></div>`).join('')}</div>`:''})()}<div class="gal">${G.map((u,i)=>col('GH').some(x=>x.id=='b'+i)?'':`<div style="background:url(${u}) center/cover;position:relative"><button class="gx" onclick="if(confirm('Скрыть фото из галереи?'))ghide('b${i}')">×</button></div>`).join('')}</div>${col('GH').length?`<button class="btn s" style="margin-top:10px" onclick="gshow()">Восстановить скрытые (${col('GH').length})</button>`:''}`}
 else if(sub=='adm'){ttl='Настройки мастера';o=`<div class="card"><label>WhatsApp (цифры с кодом страны, без +)</label><input class="f" id="sw" value="${esc(c.wa)}" placeholder="77001234567"><label>Номер для звонков</label><input class="f" id="stl" value="${esc(c.tel||'')}" placeholder="77001234567"><label>KaspiGold (номер для переводов)</label><input class="f" id="skp" value="${esc(c.kp||'')}" placeholder="77001234567"><label>Адрес салона</label><input class="f" id="sa" value="${esc(c.addr)}"><label>Бонус: визитов до скидки</label><input class="f" id="sn" type="number" value="${c.after}"><label>Размер скидки, %</label><input class="f" id="sp" type="number" value="${c.pct}"><button class="btn" onclick="setCF({wa:dg($('#sw').value),tel:dg($('#stl').value),kp:dg($('#skp').value),addr:$('#sa').value,after:+$('#sn').value||5,pct:+$('#sp').value||0});toast('Сохранено')">Сохранить</button></div>
 <h3>Админ мастера</h3><div class="card"><label>Имя админа</label><input class="f" id="adn" value="${esc(c.an||'')}" placeholder="Новое имя" autocapitalize="off"><label>Текущий пароль</label><input class="f" id="ado" type="password"><label>Новый пароль (минимум 6 символов)</label><input class="f" id="adp" type="password"><button class="btn" onclick="sadm()">Сохранить имя и пароль</button></div>
 <h3>Облако</h3><div class="card">${CLOUD.url?'Подключено ☁️':'Не подключено 💾 (данные только на этом устройстве)'}<br><button class="btn s" onclick="sync();toast('Синхронизация…')">Синхронизировать</button> <button class="btn s" onclick="chkCloud()">Проверить облако</button></div>`}
 else o=[['gen','key','Генератор 2FA','Коды входа для клиентов'],['mp','user','Моя страница','Текст о себе и фото с подписями'],['svc','scissors','Услуги и цены','Редактор, цены и фото работ'],['prod','bag','Товары','Фото, цены и скидки'],['gal','image','Галерея работ','Фото для главного экрана'],['adm','user','Настройки мастера','Контакты, бонусы, имя и пароль админа, облако']].map(([k,i,t,d])=>`<button class="card svc" onclick="ssub('${k}')"><i class="si">${ico(i,24)}</i><span><b>${t}</b><small>${d}</small></span><span class="pr" style="color:var(--mu)">${ico('chev',20)}</span></button>`).join('')+`<button class="btn s" onclick="mlo()">Выйти из кабинета</button>`;
 f._s=sub;f.style.display='flex';f.innerHTML=`<div class="fsb"><button onclick="${sub?"ssub('')":"go('ord')"}">${ico(sub?'back':'x',22)}</button><b>${ttl}</b><button style="margin-left:auto" onclick="fsT()">${ico('full',20)}</button></div><div class="fsc" id="fsc">${o}</div>`;$('#fsc').scrollTop=keep;if(sub=='gen')genR()}
const gdel=id=>{if(role!='m'||!mAuth)return;rm('GL',id);rSet()};
const ghide=id=>{if(role!='m'||!mAuth)return;put('GH',{id});rSet()};
const gshow=()=>{if(role!='m'||!mAuth)return;col('GH').forEach(x=>rm('GH',x.id));rSet()};
async function gnew(inp){const fs=[...inp.files].slice(0,6);if(!fs.length)return;toast('Загрузка…');const im=[];for(const f of fs)im.push(await img(f,900,.7));put('GL',{id:'g'+Date.now()+Math.random().toString(36).slice(2,6),im});toast('Работа добавлена: '+im.length+' фото');rSet()}
async function gmore(id,inp){const x=getI('GL',id),im=gim(x).slice();for(const f of[...inp.files].slice(0,6-im.length))im.push(await img(f,900,.7));x.im=im;put('GL',x);rSet()}
function gpdel(id,i){if(role!='m'||!mAuth)return;const x=getI('GL',id),im=gim(x).slice();im.splice(i,1);if(!im.length)return gdel(id);x.im=im;put('GL',x);rSet()}
function prodAdmin(){return col('P').map(p=>{const im=p.im||[];return `<div class="card"><div class="row"><b>${esc(p.n)}</b><button class="btn s" onclick="pe('${p.id}')">Изменить</button></div><div class="mu">${money(p.p)} · скидка ${p.d||0}%</div>${p.ds?`<div class="mu">${esc(p.ds)}</div>`:''}<div class="pth">${im.map((u,i)=>`<div style="background:var(--bg) url(${u}) center/contain no-repeat" onclick="lb('${p.id}',${i})"><button onclick="event.stopPropagation();pdel('${p.id}',${i})">×</button></div>`).join('')}${im.length<3?`<label class="add">${ico('camera',22)}<small>${im.length}/3</small><input type="file" accept="image/*" multiple hidden onchange="padd('${p.id}',this)"></label>`:''}</div><div style="margin-top:8px"><button class="btn s" onclick="pd('${p.id}')">Скидка %</button> <button class="btn s" onclick="if(confirm('Удалить товар?')){rm('P','${p.id}');rSet()}">Удалить</button></div></div>`}).join('')}
async function padd(id,inp){const p=getI('P',id);p.im=p.im||[];for(const f of[...inp.files].slice(0,3-p.im.length))p.im.push(await img(f,560,.66));put('P',p);rSet()}
function pdel(id,i){const p=getI('P',id);p.im.splice(i,1);put('P',p);rSet()}
function pe(id){const p=getI('P',id),n=prompt('Название',p.n);if(n===null)return;const c=prompt('Цена, ₸',p.p);if(c===null)return;const ds=prompt('Описание товара',p.ds||'');if(ds===null)return;p.n=n.trim()||p.n;p.p=+c||p.p;p.ds=ds.trim();put('P',p);rSet()}
function pd(id){const p=getI('P',id),v=prompt('Скидка на товар, %',p.d||0);if(v!==null){p.d=Math.max(0,Math.min(60,+v||0));put('P',p);rSet()}}
function ap(){const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!p)return toast('Название и цена');put('P',{id:'p'+Date.now(),n,e:'🧴',p,d:0});rSet()}

/* ===== РЕДАКТОР УСЛУГ ===== */
let SE='';
function svcAdmin(){
 return `<p class="mu" style="margin-top:0">Измените название, цену, время и описание. Добавьте до 5 фото работ. Клиент видит фото в разделе «Услуги».</p>`+grp(SA).map(([g,l])=>`<h3 class="gh">${g}</h3>`+l.map(s=>{
  const ed=SE==s.id;
  const form=ed?`<label>Название</label><input class="f" id="sen" value="${esc(s.n)}"><label>Цена, ₸ (пусто — «Цена по запросу»)</label><input class="f" id="sep" type="number" inputmode="numeric" value="${s.pn}"><label><input type="checkbox" id="sef" ${s.f==1?'checked':''}> Цена «от»</label><label>Время, мин</label><input class="f" id="sem" type="number" inputmode="numeric" step="5" value="${s.m}"><label>Описание</label><input class="f" id="sed" value="${esc(s.d||'')}"><button class="btn" onclick="ssave('${s.id}')">Сохранить</button>`:'';
  return `<div class="card"><div class="row"><b>${esc(s.n)}</b><span class="pr">${s.p}</span></div><div class="mu">${dur(s.m)}${s.vis?'':' · скрыта от клиентов'}</div><div class="pth">${s.im.map((u,i)=>`<div style="background:var(--bg) url(${u}) center/contain no-repeat" onclick="lbo(SA.find(x=>x.id=='${s.id}').im,${i})"><button onclick="event.stopPropagation();sidel('${s.id}',${i})">×</button></div>`).join('')}${s.im.length<5?`<label class="add">${ico('camera',22)}<small>${s.im.length}/5</small><input type="file" accept="image/*" multiple hidden onchange="siadd('${s.id}',this)"></label>`:''}</div>${form}<div style="margin-top:8px"><button class="btn s" onclick="SE='${ed?'':s.id}';rSet()">${ed?'Закрыть':'Изменить'}</button> <button class="btn s" onclick="svis('${s.id}')">${s.vis?'Скрыть':'Показать'}</button> <button class="btn s" onclick="sdel('${s.id}')">Удалить</button></div></div>`}).join('')).join('')
  +`<div class="card"><b>Добавить услугу</b><input class="f" id="snn" placeholder="Название"><select class="f" id="snc">${SCAT.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select><input class="f" id="snp" type="number" inputmode="numeric" placeholder="Цена, ₸"><input class="f" id="snm" type="number" inputmode="numeric" placeholder="Время, мин (60)"><button class="btn" onclick="snew()">Добавить</button></div>`}
const sRec=id=>{const s=SA.find(x=>x.id==id);return getI('V',id)||{id,n:s.n,e:s.e,ic:s.ic||SI[id],g:s.g,m:s.m,d:s.d,im:s.im.slice(),vis:s.vis?1:0,pn:s.pn,f:s.f||0,c:Date.now()}};
const sput=x=>{put('V',x);rSet()};
function ssave(id){const x=sRec(id),n=$('#sen').value.trim();if(!n)return toast('Введите название');const p=$('#sep').value;x.n=n;x.pn=p===''?'':Math.max(0,+p);x.f=$('#sef').checked?1:(x.f===2?2:0);x.m=Math.max(5,+$('#sem').value||x.m);x.d=$('#sed').value.trim();SE='';sput(x);toast('Сохранено')}
function svis(id){const x=sRec(id);x.vis=x.vis?0:1;sput(x)}
function sdel(id){if(!confirm('Удалить услугу?'))return;put('V',sRec(id));rm('V',id);rSet()}
async function siadd(id,inp){const x=sRec(id);x.im=(x.im||[]).slice();toast('Загрузка…');for(const f of[...inp.files].slice(0,5-x.im.length))x.im.push(await img(f,700,.68));sput(x)}
function sidel(id,i){const x=sRec(id);x.im=x.im.slice();x.im.splice(i,1);sput(x)}
function snew(){const n=$('#snn').value.trim(),p=$('#snp').value,m=+$('#snm').value||60,c=SCAT[+$('#snc').value];if(!n)return toast('Введите название');put('V',{id:'v'+Date.now(),n,g:c[0],e:c[1],ic:c[2],m:Math.max(5,m),d:'',im:[],vis:1,pn:p===''?'':+p,f:0,c:Date.now()});rSet();toast('Услуга добавлена')}

/* ===== ЛИЧНАЯ СТРАНИЦА МАСТЕРА ===== */
const MPD={nm:'Гуля',tag:'Владелица салона · мастер мужских стрижек',bio:'Я Гуля, владелица салона «DIAMOND». Делаю мужские стрижки, ухаживаю за бородой и усами, делаю брови.\nЯ люблю, когда клиент выходит из кресла уверенным в себе.\nПриходите. Мы вместе подберём форму, которая вам идёт.'};
const mpC=()=>({...MPD,...(getI('MP','main')||{})});
const mpPh=()=>col('MP').filter(x=>x.id!='main'&&x.im).sort((a,b)=>(b.c||b.u)-(a.c||a.u));
function rMP(){const c=mpC(),ph=mpPh();$('#main').innerHTML=`<div class="hero"><h2>${esc(c.nm)}</h2><p>${esc(c.tag)}</p></div><div class="card mpq">${esc(c.bio).replace(/\n/g,'<br>')}</div>`
 +(ph.length?`<h3>Из моих рабочих дней</h3>`+ph.map((x,i)=>`<figure class="mpf"><img src="${x.im}" alt="" onclick="lbo(mpPh().map(y=>y.im),${i})"><figcaption>${esc(x.cap||'')}</figcaption></figure>`).join(''):`<p class="mu">Фото с работы скоро появятся.</p>`)
 +`<button class="btn" onclick="go('bot')">Записаться ко мне</button>`}
function mpAdmin(){const c=mpC(),ph=mpPh();
 return `<p class="mu" style="margin-top:0">Это ваша личная страница. Клиент видит её в меню «О мастере».</p>
 <div class="card"><label>Имя</label><input class="f" id="mpn" value="${esc(c.nm)}"><label>Подзаголовок</label><input class="f" id="mpt" value="${esc(c.tag)}"><label>Текст о себе</label><textarea class="f" id="mpb" style="min-height:120px">${esc(c.bio)}</textarea><button class="btn" onclick="mpsave()">Сохранить текст</button></div>
 <h3>Фото с подписями (${ph.length}/12)</h3>
 ${ph.length<12?`<label class="btn" style="display:inline-flex;align-items:center;gap:8px;margin-bottom:10px">${ico('camera',20)} Добавить фото<input type="file" accept="image/*" multiple hidden onchange="mpadd(this)"></label>`:''}
 ${ph.map(x=>`<div class="card"><div class="mpa"><img src="${x.im}" alt="" onclick="lbo(mpPh().map(y=>y.im),${ph.indexOf(x)})"><input class="f" value="${esc(x.cap||'')}" placeholder="Подпись к фото" maxlength="140" onchange="mpcap('${x.id}',this.value)"></div><button class="btn s" style="margin-top:8px" onclick="if(confirm('Удалить фото?')){rm('MP','${x.id}');rSet()}">Удалить</button></div>`).join('')}`}
function mpsave(){const x=getI('MP','main')||{id:'main'};x.nm=$('#mpn').value.trim()||MPD.nm;x.tag=$('#mpt').value.trim();x.bio=$('#mpb').value.trim()||MPD.bio;put('MP',x);toast('Сохранено')}
async function mpadd(inp){const n=12-mpPh().length;toast('Загрузка…');for(const f of[...inp.files].slice(0,n))put('MP',{id:'m'+Date.now()+Math.random().toString(36).slice(2,5),im:await img(f,900,.72),cap:'',c:Date.now()});toast('Фото добавлено. Напишите подпись.');rSet()}
function mpcap(id,v){const x=getI('MP',id);if(x){x.cap=v.trim();put('MP',x);toast('Подпись сохранена')}}
async function genR(){const g=$('#gen');if(!g)return;const u=col('U'),left=180-(Math.floor(Date.now()/1000)%180),cs=await Promise.all(u.map(x=>totp(x.sec)));if(!$('#gen'))return;
 g.innerHTML=u.length?u.map((x,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span><b>${esc(x.name)}</b><br><small class="mu">+${esc(x.phone)}</small></span><span style="text-align:right"><b style="font-size:26px;letter-spacing:4px;color:var(--p)">${cs[i]}</b><br><small class="mu">${Math.floor(left/60)}:${p2(left%60)}</small></span></div>`).join('')+`<div class="bar"><i style="width:${left/180*100}%"></i></div>`:'<p class="mu">Клиентов пока нет.</p>'}
async function sadm(){const n=$('#adn').value.trim(),o=$('#ado').value,w=$('#adp').value,c=CF();if(!n||w.length<6)return toast('Имя обязательно. Пароль: минимум 6 символов');
 if(!(await chk(c.an||c.wa,o)))return toast('Текущий пароль неверный');setCF({an:n,ah:await sha(w)});msave();$('#ado').value=$('#adp').value='';toast('Имя и пароль админа сохранены')}
const mlo=()=>{mAuth=0;sv('dm_ma',null);sv('dm_role','c');sv('dm_tab','home');setRole('c')};
setInterval(()=>{if(tab=='set'&&mAuth)genR()},1000);
applyLang();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
nav();R();sync();rt();setInterval(sync,10000);addEventListener('online',()=>{sync();rt()});

</script></body></html>
